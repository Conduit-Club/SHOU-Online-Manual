# Nginx Proxy Manager custom HTTP configuration for Artalk.
# Replace example hostnames and certificate paths with your own.
# Origin Rules must use the HTTP and HTTPS ports published by your proxy.
# Handbook clients use their same-origin /api/v2/ route, not this hostname.
server {
    listen 80;
    listen [::]:80;
    server_name comments.example.com;

    return 301 https://comments.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name comments.example.com;

    ssl_certificate /data/nginx/custom/comments.example.com.crt;
    ssl_certificate_key /data/nginx/custom/comments.example.com.key;
    include /etc/nginx/conf.d/include/ssl-ciphers.conf;

    location / {
        proxy_pass http://artalk:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
