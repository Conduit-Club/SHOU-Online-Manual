# Nginx Proxy Manager custom HTTP configuration for Artalk.
# The Cloudflare Origin Rule routes comments.moear.de to host port 18443,
# which is published by Nginx Proxy Manager as container port 443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name comments.moear.de;

    ssl_certificate /data/nginx/custom/comments.moear.de.crt;
    ssl_certificate_key /data/nginx/custom/comments.moear.de.key;
    include /etc/nginx/conf.d/include/ssl-ciphers.conf;

    location / {
        proxy_pass http://artalk:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
