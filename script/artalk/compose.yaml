services:
  artalk:
    image: artalk/artalk-go:2.10.0
    container_name: artalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:23366:23366"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_SITE_DEFAULT: ${ATK_SITE_DEFAULT:-水专手册}
      ATK_SITE_URL: ${ATK_SITE_URL:?set the public handbook URL}
      ATK_TRUSTED_DOMAINS: ${ATK_TRUSTED_DOMAINS:?set the allowed handbook origins}
    command: ["server", "--host", "0.0.0.0", "--port", "23366"]
