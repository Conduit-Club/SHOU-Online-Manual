# Include this location in your handbook's outermost HTTPS proxy.
# Route directly to Artalk, bypassing the static handbook container and
# the standalone comments hostname. The proxy must share a Docker network with Artalk
# so that the `artalk` hostname resolves. For a host-level Nginx,
# replace the upstream with http://127.0.0.1:23366.
location ^~ /api/v2/ {
    proxy_pass http://artalk:23366;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
